<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Therapist Kitchen</title>
    <style>
      
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
}

body {
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

.auth-card {
    background: #ffffff;
    padding: 40px 32px;
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    width: 100%;
    max-width: 420px;
    border: 1px solid #334155;
}

.logo {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    margin: 0 auto 20px auto;
    display: block;
    object-fit: cover;
    box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
    border: 3px solid #2563eb;
}

h2 {
    margin-bottom: 24px;
    color: #0f172a;
    text-align: center;
    font-weight: 700;
    font-size: 1.75rem;
    letter-spacing: -0.5px;
}

.form-group {
    margin-bottom: 18px;
}

label {
    display: block;
    margin-bottom: 6px;
    font-size: 0.85rem;
    font-weight: 600;
    color: #475569;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

input, select {
    width: 100%;
    padding: 13px 16px;
    border: 1.5px solid #cbd5e1;
    border-radius: 10px;
    font-size: 0.95rem;
    background: #f8fafc;
    color: #0f172a;
    transition: all 0.25s ease;
}

input:focus, select:focus {
    outline: none;
    border-color: #2563eb;
    background: #ffffff;
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
}

button {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
    box-shadow: 0 4px 14px rgba(30, 64, 175, 0.35);
    transition: all 0.25s ease;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(30, 64, 175, 0.45);
}

button:disabled {
    background: #94a3b8;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
}

.msg {
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 18px;
    text-align: center;
    font-size: 0.88rem;
    font-weight: 500;
    display: none;
}

.error {
    background: #fef2f2;
    color: #dc2626;
    border: 1px solid #fecaca;
}

.success {
    background: #f0fdf4;
    color: #16a34a;
    border: 1px solid #bbf7d0;
}

.footer-link {
    text-align: center;
    margin-top: 22px;
    font-size: 0.9rem;
    color: #64748b;
}

.footer-link a {
    color: #2563eb;
    text-decoration: none;
    font-weight: 600;
}

.footer-link a:hover {
    text-decoration: underline;
}
    </style>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="auth-card">
        <h2>Create Account</h2>
        <img src="therapist.jpg" alt="logo" class="logo">
        <!-- Status Messages -->
        <div id="error-msg" class="msg error"></div>
        <div id="success-msg" class="msg success"></div>
        
        <form id="register-form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>
            
            <button type="submit" id="submit-btn">Sign Up</button>
        </form>
        
        <div class="footer-link">
            Already have an account? <a href="login.html">Login here</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // Initialize Supabase Client
    const SUPABASE_URL = 'https://umkhoitnouazrfdpftld.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_EzmGw6JDJyehqfK1VNhZQg_21JYto78';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('register-form');
    const submitBtn = document.getElementById('submit-btn');
    const errorMsg = document.getElementById('error-msg');
    const successMsg = document.getElementById('success-msg');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        // Clear past messages & set loading state
        if (errorMsg) errorMsg.style.display = 'none';
        if (successMsg) successMsg.style.display = 'none';
        if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.innerText = 'Creating account...';
        }

        const username = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();

        // Save new customer directly to your 'users' table
        const { data: newUser, error: dbError } = await _supabase
            .from('users')
            .insert([
                { 
                    username: username, 
                    email: email, 
                    password: password,
                    role: 'customer' // Automatically set as customer
                }
            ])
            .select()
            .single();

        if (dbError) {
            showError(dbError.message);
        } else {
            // Save customer session state automatically
            localStorage.setItem('user_id', newUser.id);
            localStorage.setItem('role', 'customer');

            showSuccess("Account created successfully! Redirecting...");
            form.reset();

            // Redirect customer to store home page after 1.5 seconds
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        }
    });

    function showError(msg) {
        if (errorMsg) {
            errorMsg.innerHTML = msg;
            errorMsg.style.display = 'block';
        } else {
            alert(msg);
        }
        if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.innerText = 'Sign Up';
        }
    }

    function showSuccess(msg) {
        if (successMsg) {
            successMsg.innerHTML = msg;
            successMsg.style.display = 'block';
        } else {
            alert(msg);
        }
        if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.innerText = 'Sign Up';
        }
    }
</script>
</body>
</html>

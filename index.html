<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Therapist Kitchen - Home</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
       @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
}

body {
    background: #f1f5f9;
    padding-bottom: 80px;
}

header {
    background: #0f172a;
    padding: 14px 20px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    border-bottom: 1px solid #1e293b;
}

.search-bar {
    display: flex;
    gap: 8px;
    flex: 1;
    max-width: 600px;
}

.search-bar input {
    flex: 1;
    padding: 10px 16px;
    border: 1.5px solid #334155;
    border-radius: 20px;
    font-size: 0.9rem;
    background: #1e293b;
    color: #f8fafc;
}

.search-bar input:focus {
    outline: none;
    border-color: #2563eb;
    background: #0f172a;
}

.search-bar button {
    padding: 10px 20px;
    background: #2563eb;
    color: #ffffff;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    font-weight: 600;
    transition: background 0.2s;
}

.search-bar button:hover {
    background: #1d4ed8;
}

.profile-icon {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #38bdf8;
    flex-shrink: 0;
    transition: transform 0.2s;
}

.profile-icon:hover {
    transform: scale(1.05);
}

.container {
    max-width: 900px;
    margin: 25px auto;
    padding: 0 16px;
}

.product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 18px;
}

.product-card {
    background: #ffffff;
    border-radius: 14px;
    border: 1px solid #e2e8f0;
    padding: 14px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.03);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.product-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 24px rgba(15, 23, 42, 0.1);
}

.product-card img {
    width: 100%;
    height: 140px;
    object-fit: cover;
    border-radius: 10px;
    margin-bottom: 12px;
    cursor: pointer;
}

.product-title {
    font-size: 1rem;
    font-weight: 600;
    color: #0f172a;
    margin-bottom: 4px;
}

.product-price {
    font-size: 1.05rem;
    color: #059669;
    font-weight: 700;
    margin-bottom: 8px;
}

.tag-list {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 12px;
}

.tag {
    background: #f1f5f9;
    font-size: 0.7rem;
    padding: 3px 8px;
    border-radius: 6px;
    color: #475569;
    font-weight: 600;
}

.btn-buy {
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #ffffff;
    border: none;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    width: 100%;
    transition: background 0.2s;
}

.btn-buy:hover {
    background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
}

.image-modal {
    display: none;
    position: fixed;
    z-index: 2000;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(15, 23, 42, 0.9);
    backdrop-filter: blur(6px);
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.image-modal img {
    max-width: 90%;
    max-height: 85vh;
    object-fit: contain;
    border-radius: 12px;
}

.close-modal {
    position: absolute;
    top: 20px;
    right: 25px;
    color: #ffffff;
    font-size: 35px;
    font-weight: bold;
    cursor: pointer;
}

.footer-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #0f172a;
    border-top: 1px solid #1e293b;
    display: flex;
    justify-content: space-around;
    padding: 12px 0;
    z-index: 1000;
    box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.15);
}

.footer-nav a {
    text-decoration: none;
    color: #94a3b8;
    font-size: 0.82rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-weight: 600;
}

.footer-nav a i {
    font-size: 1.2rem;
}

.footer-nav a.active {
    color: #38bdf8;
}
    </style>
</head>
<body>

    <header>
        <form class="search-bar" id="search-form">
            <input type="text" id="search-input" placeholder="Search by name or tags...">
            <button type="submit">Search</button>
        </form>
        <a href="profile.html">
            <img id="header-profile-pic" src="https://via.placeholder.com/150" class="profile-icon" alt="Profile">
        </a>
    </header>

    <div class="container">
        <h3 style="margin-bottom: 15px; color: #333;">Available Menu</h3>
        <div class="product-grid" id="product-grid">
            <p class="no-products">Loading products...</p>
        </div>
    </div>

    <!-- Fixed Footer Navigation -->
    <nav class="footer-nav">
        <a href="index.html" class="active"><i class="fa-solid fa-house"></i>Home</a>
        <a href="cart.html"><i class="fa-solid fa-cart-shopping"></i>Cart</a>
        <a href="chat.html"><i class="fa-solid fa-message"></i>Chat</a>
    </nav>
    <nav class="footer-ad">
    </nav>

    <!-- Image Modal Container -->
    <div id="imageModal" class="image-modal" onclick="closePreview()">
        <span class="close-modal" onclick="closePreview()">&times;</span>
        <img id="modalImg" src="" alt="Full Preview">
    </div>

    <!-- Ordering Modal -->
    <div id="order-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; justify-content: center; align-items: center;">
        <div style="background: #fff; padding: 20px; border-radius: 10px; max-width: 400px; width: 90%;">
            <h3 id="modal-title" style="margin-bottom: 10px; color: #111;">Order Details</h3>
            
            <!-- Notice for Pastries -->
            <div id="pastry-notice" style="display: none; background: #fff3cd; color: #856404; padding: 10px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 15px;">
                <i class="fa-solid fa-circle-info"></i> <strong>Note:</strong> Pastries are only available for weekend deliveries (Fridays, Saturdays, and Sundays).
            </div>

            <div style="margin-bottom: 15px;">
                <label id="date-label" style="display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 5px;">When do you need this delivered?</label>
                <input type="date" id="delivery-date-input" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem;">
            </div>

            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button id="cancel-order-btn" style="padding: 10px 15px; border: none; background: #eee; border-radius: 6px; cursor: pointer;">Cancel</button>
                <button id="confirm-order-btn" style="padding: 10px 15px; border: none; background: #007bff; color: white; border-radius: 6px; font-weight: 600; cursor: pointer;">Confirm Order</button>
            </div>
        </div>
    </div>

    <script>
        // Check Authentication
        const customerId = localStorage.getItem('user_id');
        const role = localStorage.getItem('role');

        if (!customerId || role !== 'customer') {
            window.location.href = 'login.html';
        }

        // Initialize Supabase Client
        const SUPABASE_URL = 'https://umkhoitnouazrfdpftld.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_EzmGw6JDJyehqfK1VNhZQg_21JYto78';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let selectedProductId = null;
        let selectedCategory = 'cakes';

        // Load User Profile Pic & Products on Initialization
        document.addEventListener('DOMContentLoaded', () => {
            loadUserProfile();
            loadProducts();

            // Cancel Modal Listener
            document.getElementById('cancel-order-btn').addEventListener('click', () => {
                document.getElementById('order-modal').style.display = 'none';
            });

            // Confirm Order Listener
            document.getElementById('confirm-order-btn').addEventListener('click', handleConfirmOrder);
        });

        // 1. Fetch User Profile
        async function loadUserProfile() {
            const { data: user, error } = await _supabase
                .from('users')
                .select('profile_pic')
                .eq('id', customerId)
                .single();

            if (user && user.profile_pic) {
                let cleanPic = user.profile_pic.replace('./', '');
                document.getElementById('header-profile-pic').src = cleanPic + '?v=' + new Date().getTime();
            }
        }

        // 2. Fetch & Display Products
        async function loadProducts(query = '') {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '<p class="no-products">Loading products...</p>';

            let req = _supabase.from('products').select('*').order('id', { ascending: false });

            if (query.trim() !== '') {
                req = req.or(`name.ilike.%${query}%,tags.ilike.%${query}%`);
            }

            const { data: products, error } = await req;

            if (error) {
                grid.innerHTML = '<p class="no-products">Failed to load products.</p>';
                return;
            }

            if (!products || products.length === 0) {
                grid.innerHTML = '<p class="no-products">No products found.</p>';
                return;
            }

            grid.innerHTML = '';
            products.forEach(product => {
                const tagsArray = product.tags ? product.tags.split(',') : [];
                const tagsHtml = tagsArray.map(t => `<span class="tag">#${t.trim()}</span>`).join('');
                const categoryAttr = (product.category || 'cakes').replace(/'/g, "\\'");

                const cardHtml = `
                    <div class="product-card">
                        <div>
                            <img src="${product.image_url}" alt="${escapeHtml(product.name)}" onclick="openPreview('${product.image_url}')">
                            <div class="product-title">${escapeHtml(product.name)}</div>
                            <div class="product-price">₦${parseFloat(product.price).toLocaleString('en-US', { minimumFractionDigits: 2 })}</div>
                            <div class="tag-list">${tagsHtml}</div>
                        </div>
                        <button class="btn-buy" onclick="openOrderModal(${product.id}, '${categoryAttr}')">Buy Now & Chat</button>
                    </div>
                `;
                grid.innerHTML += cardHtml;
            });
        }

        // 3. Search Form Handler
        document.getElementById('search-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const query = document.getElementById('search-input').value;
            loadProducts(query);
        });

        // 4. Open Modal Workflow
        function openOrderModal(productId, category) {
            selectedProductId = productId;
            selectedCategory = category ? category.toLowerCase() : 'cakes';

            const modal = document.getElementById('order-modal');
            const pastryNotice = document.getElementById('pastry-notice');
            const dateInput = document.getElementById('delivery-date-input');
            
            // Set minimum date to today
            const today = new Date().toISOString().split('T')[0];
            dateInput.min = today;
            dateInput.value = '';

            if (selectedCategory === 'pastries') {
                pastryNotice.style.display = 'block';
            } else {
                pastryNotice.style.display = 'none';
            }

            modal.style.display = 'flex';
        }

        // 5. Confirm Order Handler
        async function handleConfirmOrder() {
            const dateValue = document.getElementById('delivery-date-input').value;

            if (!dateValue) {
                alert('Please select a delivery date!');
                return;
            }

            // Check day of week (0 = Sunday, 1 = Monday, ..., 5 = Friday, 6 = Saturday)
            const [year, month, day] = dateValue.split('-').map(Number);
            const chosenDate = new Date(year, month - 1, day);
            const dayOfWeek = chosenDate.getDay();

            // Pastry Weekend Validation (5 = Friday, 6 = Saturday, 0 = Sunday)
            if (selectedCategory === 'pastries') {
                if (dayOfWeek !== 0 && dayOfWeek !== 5 && dayOfWeek !== 6) {
                    alert('Pastries can only be ordered for Fridays, Saturdays, or Sundays. Please select a valid weekend date.');
                    return;
                }
            }

            const confirmBtn = document.getElementById('confirm-order-btn');
            confirmBtn.disabled = true;
            confirmBtn.innerText = 'Placing order...';

            // Insert Order with Delivery Date
            const { data: order, error: orderError } = await _supabase
                .from('orders')
                .insert([
                    {
                        customer_id: parseInt(customerId),
                        product_id: selectedProductId,
                        status: 'Pending',
                        delivery_date: dateValue
                    }
                ])
                .select()
                .single();

            if (orderError) {
                alert('Failed to place order: ' + orderError.message);
                confirmBtn.disabled = false;
                confirmBtn.innerText = 'Confirm Order';
                return;
            }

            // Auto-create initial chat message
            const initialMsg = `Hello! I just placed order #${order.id} for delivery on ${dateValue}.`;
            await _supabase
                .from('messages')
                .insert([{ 
                    order_id: order.id, 
                    sender_id: parseInt(customerId), 
                    message: initialMsg 
                }]);

            confirmBtn.disabled = false;
            confirmBtn.innerText = 'Confirm Order';
            document.getElementById('order-modal').style.display = 'none';

            // Redirect to Chat Page
            window.location.href = `chat.html?order_id=${order.id}`;
        }

        // Lightbox Functions
        function openPreview(imageSrc) {
            document.getElementById('modalImg').src = imageSrc;
            document.getElementById('imageModal').style.display = 'flex';
        }

        function closePreview() {
            document.getElementById('imageModal').style.display = 'none';
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }
    </script>
</body>
</html>

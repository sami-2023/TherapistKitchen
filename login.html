<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Therapist Kitchen</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
}

body {
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

.auth-card {
    background: #ffffff;
    padding: 40px 32px;
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    width: 100%;
    max-width: 400px;
    border: 1px solid #334155;
}

.logo {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    margin: 0 auto 20px auto;
    display: block;
    object-fit: cover;
    box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
    border: 3px solid #2563eb;
}

h2 {
    margin-bottom: 20px;
    color: #0f172a;
    text-align: center;
    font-weight: 700;
    font-size: 1.75rem;
}

.form-group {
    margin-bottom: 16px;
}

label {
    display: block;
    margin-bottom: 6px;
    font-size: 0.85rem;
    font-weight: 600;
    color: #475569;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

input {
    width: 100%;
    padding: 13px 16px;
    border: 1.5px solid #cbd5e1;
    border-radius: 10px;
    font-size: 0.95rem;
    background: #f8fafc;
    color: #0f172a;
    transition: all 0.25s ease;
}

input:focus {
    outline: none;
    border-color: #2563eb;
    background: #ffffff;
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
}

button {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
    box-shadow: 0 4px 14px rgba(30, 64, 175, 0.35);
    transition: all 0.25s ease;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(30, 64, 175, 0.45);
}

button:disabled {
    background: #94a3b8;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
}

.msg {
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 18px;
    text-align: center;
    font-size: 0.88rem;
    background: #fef2f2;
    color: #dc2626;
    border: 1px solid #fecaca;
    display: none;
}

.footer-link {
    text-align: center;
    margin-top: 20px;
    font-size: 0.9rem;
    color: #64748b;
}

.footer-link a {
    color: #2563eb;
    text-decoration: none;
    font-weight: 600;
}

.footer-link a:hover {
    text-decoration: underline;
}
    </style>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="auth-card">
        <h2>Welcome Back</h2>
        <img class="logo" src="therapist.jpg" alt="logo">
        <!-- Error Message Container -->
        <div id="error-msg" class="msg"></div>
        
        <form id="login-form">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" id="submit-btn">Login</button>
        </form>
        
        <div class="footer-link">
            Don't have an account? <a href="register.html">Sign up here</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // Initialize Supabase Client
    const SUPABASE_URL = 'https://umkhoitnouazrfdpftld.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_EzmGw6JDJyehqfK1VNhZQg_21JYto78';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');
    const errorMsg = document.getElementById('error-msg');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        // Clear previous errors and disable button while logging in
        if (errorMsg) errorMsg.style.display = 'none';
        if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.innerText = 'Logging in...';
        }

        // 1. Get user input and clean up extra spaces
        const userInput = document.getElementById('email').value.trim(); 
        const passwordInput = document.getElementById('password').value.trim();

        // --- HARDCODED ADMIN CHECK ---
        const ADMIN_USER = 'admin@gmail.com';
        const ADMIN_PASS = 'admin12345';

        if (userInput.toLowerCase() === ADMIN_USER.toLowerCase() && passwordInput === ADMIN_PASS) {
            // Save admin session state
            localStorage.setItem('user_id', 'admin_1');
            localStorage.setItem('role', 'admin');
            localStorage.setItem('admin_session', 'authenticated_admin_access');

            // Direct to admin dashboard
            window.location.href = 'admin.html';
            return;
        }

        // --- CUSTOMER SUPABASE DATABASE CHECK ---
        const { data: user, error } = await _supabase
            .from('users')
            .select('*')
            .or(`username.eq.${userInput},email.eq.${userInput}`)
            .eq('password', passwordInput)
            .maybeSingle();

        if (error || !user) {
            if (errorMsg) {
                errorMsg.innerText = 'Invalid email/username or password credentials.';
                errorMsg.style.display = 'block';
            } else {
                alert('Invalid email/username or password credentials.');
            }

            if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Login';
            }
            return;
        }

        // Save customer session state
        localStorage.setItem('user_id', user.id);
        localStorage.setItem('role', user.role || 'customer');

        // Direct customer to store home page
        window.location.href = 'index.html';
    });
</script>
</body>
</html>

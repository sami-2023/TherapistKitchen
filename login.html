<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MyShop</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #f4f6f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .auth-card { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 100%; max-width: 400px; }
        h2 { margin-bottom: 20px; color: #111; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #555; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
        button { width: 100%; padding: 12px; background: #007bff; color: #fff; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #0056b3; }
        button:disabled { background: #a0c7ff; cursor: not-allowed; }
        .msg { padding: 10px; border-radius: 6px; margin-bottom: 15px; text-align: center; font-size: 0.9rem; background: #ffe6e6; color: #d93025; display: none; }
        .footer-link { text-align: center; margin-top: 15px; font-size: 0.9rem; }
        .footer-link a { color: #007bff; text-decoration: none; }
    </style>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="auth-card">
        <h2>Welcome Back</h2>
        
        <!-- Error Message Container -->
        <div id="error-msg" class="msg"></div>
        
        <form id="login-form">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" id="submit-btn">Login</button>
        </form>
        
        <div class="footer-link">
            Don't have an account? <a href="register.html">Sign up here</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // Initialize Supabase Client
    const SUPABASE_URL = 'https://umkhoitnouazrfdpftld.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_EzmGw6JDJyehqfK1VNhZQg_21JYto78';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');
    const errorMsg = document.getElementById('error-msg');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        // Clear previous errors and disable button while logging in
        if (errorMsg) errorMsg.style.display = 'none';
        if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.innerText = 'Logging in...';
        }

        // 1. Get user input and clean up extra spaces
        const userInput = document.getElementById('email').value.trim(); 
        const passwordInput = document.getElementById('password').value.trim();

        // --- HARDCODED ADMIN CHECK ---
        const ADMIN_USER = 'admin@gmail.com';
        const ADMIN_PASS = 'admin12345';

        if (userInput.toLowerCase() === ADMIN_USER.toLowerCase() && passwordInput === ADMIN_PASS) {
            // Save admin session state
            localStorage.setItem('user_id', 'admin_1');
            localStorage.setItem('role', 'admin');
            localStorage.setItem('admin_session', 'authenticated_admin_access');

            // Direct to admin dashboard
            window.location.href = 'admin.html';
            return;
        }

        // --- CUSTOMER SUPABASE DATABASE CHECK ---
        const { data: user, error } = await _supabase
            .from('users')
            .select('*')
            .or(`username.eq.${userInput},email.eq.${userInput}`)
            .eq('password', passwordInput)
            .maybeSingle();

        if (error || !user) {
            if (errorMsg) {
                errorMsg.innerText = 'Invalid email/username or password credentials.';
                errorMsg.style.display = 'block';
            } else {
                alert('Invalid email/username or password credentials.');
            }

            if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Login';
            }
            return;
        }

        // Save customer session state
        localStorage.setItem('user_id', user.id);
        localStorage.setItem('role', user.role || 'customer');

        // Direct customer to store home page
        window.location.href = 'index.html';
    });
</script>
</body>
</html>

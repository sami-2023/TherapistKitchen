<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Admin Dashboard</title>

    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
       @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
}

body {
    background: #0f172a;
    color: #f8fafc;
    padding: 24px;
    padding-bottom: 90px;
}

.container {
    max-width: 900px;
    margin: 0 auto;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    background: #1e293b;
    padding: 18px 24px;
    border-radius: 14px;
    border: 1px solid #334155;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
}

.header h2 {
    font-size: 1.4rem;
    font-weight: 700;
    color: #f8fafc;
}

.header a {
    transition: opacity 0.2s;
}

.header a:hover {
    opacity: 0.8;
}

.card {
    background: #1e293b;
    padding: 26px;
    border-radius: 16px;
    border: 1px solid #334155;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    margin-bottom: 24px;
}

.card h3 {
    margin-bottom: 20px;
    font-size: 1.15rem;
    color: #38bdf8;
    font-weight: 600;
    border-bottom: 2px solid #334155;
    padding-bottom: 10px;
}

.form-group {
    margin-bottom: 16px;
}

label {
    display: block;
    font-size: 0.82rem;
    font-weight: 600;
    color: #94a3b8;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

input, select {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #334155;
    border-radius: 8px;
    font-size: 0.92rem;
    background: #0f172a;
    color: #f8fafc;
    transition: border 0.2s ease;
}

input:focus, select:focus {
    outline: none;
    border-color: #2563eb;
}

button {
    background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
    color: white;
    border: none;
    padding: 12px 22px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.2s ease;
    box-shadow: 0 3px 10px rgba(37, 99, 235, 0.3);
}

button:hover {
    transform: translateY(-1px);
    box-shadow: 0 5px 15px rgba(37, 99, 235, 0.4);
}

button:disabled {
    background: #475569;
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
}

table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    margin-top: 10px;
}

th {
    background: #0f172a;
    color: #94a3b8;
    font-weight: 600;
    text-align: left;
    padding: 12px 14px;
    border-bottom: 2px solid #334155;
    font-size: 0.82rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

td {
    padding: 14px;
    border-bottom: 1px solid #334155;
    font-size: 0.9rem;
    color: #cbd5e1;
}

tr:last-child td {
    border-bottom: none;
}

.msg-box {
    background: #064e3b;
    color: #6ee7b7;
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 20px;
    display: none;
    font-weight: 500;
    border: 1px solid #047857;
}

.msg-box.error {
    background: #7f1d1d;
    color: #fca5a5;
    border-color: #991b1b;
}

.footer-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #1e293b;
    border-top: 1px solid #334155;
    display: flex;
    justify-content: space-around;
    padding: 12px 0;
    z-index: 1000;
    box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.3);
}

.footer-nav a {
    text-decoration: none;
    color: #94a3b8;
    font-size: 0.82rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-weight: 600;
    transition: color 0.2s;
}

.footer-nav a i {
    font-size: 1.2rem;
}

.footer-nav a.active, .footer-nav a:hover {
    color: #38bdf8;
}
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>Admin Control Panel</h2>
            <div>
                <a href="chat.html" style="margin-right: 15px; color: #007bff; text-decoration: none; font-weight: bold;">
                    <i class="fa-solid fa-message"></i> Open Chats
                </a>
                <a href="#" id="logout-btn" style="color: #d93025; text-decoration: none; font-weight: bold;">Logout</a>
            </div>
        </div>

        <div id="msg-container" class="msg-box"></div>

        <!-- Add Product Card -->
        <div class="card">
            <h3>Add New Product</h3>
            <form id="add-product-form">
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" id="p-name" required>
                </div>
                <div class="form-group">
                    <label for="product-category">Category:</label>
                    <select id="product-category" required>
                        <option value="cakes">Cake</option>
                        <option value="pastries">Pastry</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Price (₦)</label>
                    <input type="number" step="0.01" id="p-price" required>
                </div>
                <div class="form-group">
                    <label>Search Tags (Comma Separated)</label>
                    <input type="text" id="p-tags" placeholder="e.g. phone, electronics, apple" required>
                </div>
                <div class="form-group">
                    <label>Product Image File</label>
                    <input type="file" id="p-image" accept="image/*">
                </div>
                <button type="submit" id="save-btn">Save Product</button>
            </form>
        </div>

        <!-- Manage Inventory -->
        <div class="card">
            <h3>Product Inventory</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Price</th>
                        <th>Tags</th>
                    </tr>
                </thead>
                <tbody id="products-table">
                    <tr><td colspan="4">Loading products...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav class="footer-nav">
        <a href="admin.html" class="active"><i class="fa-solid fa-gauge"></i>Dashboard</a>
        <a href="chat.html"><i class="fa-solid fa-message"></i>Chats</a>
    </nav>
    

    <script>
    // Session Guard for Admin
    const userId = localStorage.getItem('user_id');
    const role = localStorage.getItem('role');
    const adminSession = localStorage.getItem('admin_session');

    // Allow entry if role is admin OR admin_session key exists
    if (!userId || (role !== 'admin' && adminSession !== 'authenticated_admin_access')) {
        alert('Access Denied. Please log in as admin.');
        window.location.href = 'login.html';
    }

    // Initialize Supabase Client
    const SUPABASE_URL = 'https://umkhoitnouazrfdpftld.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_EzmGw6JDJyehqfK1VNhZQg_21JYto78';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.addEventListener('DOMContentLoaded', () => {
        loadProducts();
        
        document.getElementById('add-product-form').addEventListener('submit', handleAddProduct);
        document.getElementById('logout-btn').addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.clear();
            window.location.href = 'login.html';
        });
    });

    // Load Inventory
    async function loadProducts() {
        const tableBody = document.getElementById('products-table');

        const { data: products, error } = await _supabase
            .from('products')
            .select('*')
            .order('id', { ascending: false });

        if (error) {
            tableBody.innerHTML = '<tr><td colspan="5" style="color:red;">Error loading products.</td></tr>';
            return;
        }

        if (!products || products.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="5">No products found.</td></tr>';
            return;
        }

        tableBody.innerHTML = '';
        products.forEach(p => {
            const formattedPrice = parseFloat(p.price || 0).toLocaleString('en-US', { minimumFractionDigits: 2 });
            const row = `
                <tr>
                    <td>#${p.id}</td>
                    <td>${escapeHtml(p.name)}</td>
                    <td>${escapeHtml(p.category || 'N/A')}</td>
                    <td>₦${formattedPrice}</td>
                    <td>${escapeHtml(p.tags || '')}</td>
                </tr>
            `;
            tableBody.innerHTML += row;
        });
    }

    // Add Product + Handle File Upload
    async function handleAddProduct(e) {
        e.preventDefault();
        const saveBtn = document.getElementById('save-btn');
        saveBtn.disabled = true;
        saveBtn.innerText = 'Saving...';

        const name = document.getElementById('p-name').value.trim();
        const price = parseFloat(document.getElementById('p-price').value);
        const category = document.getElementById('product-category').value; // Grab selected category
        const tags = document.getElementById('p-tags').value.trim().toLowerCase();
        const fileInput = document.getElementById('p-image');
        
        let imageUrl = 'https://via.placeholder.com/150';

        // 1. Upload image to Supabase Storage if file is selected
        if (fileInput.files.length > 0) {
            const file = fileInput.files[0];
            const fileExt = file.name.split('.').pop();
            const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;
            const filePath = `products/${fileName}`;

            const { data: uploadData, error: uploadError } = await _supabase.storage
                .from('product-images')
                .upload(filePath, file);

            if (!uploadError && uploadData) {
                const { data: publicUrlData } = _supabase.storage
                    .from('product-images')
                    .getPublicUrl(filePath);
                
                imageUrl = publicUrlData.publicUrl;
            } else {
                console.warn('Image upload failed or bucket not set up. Using fallback image URL.');
            }
        }

        // 2. Insert Product into Database Table (including category)
        const { error: insertError } = await _supabase
            .from('products')
            .insert([{ 
                name: name, 
                price: price, 
                category: category, // Saves 'cakes' or 'pastries'
                tags: tags, 
                image_url: imageUrl 
            }]);

        saveBtn.disabled = false;
        saveBtn.innerText = 'Save Product';

        if (insertError) {
            showMessage('Error adding product: ' + insertError.message, true);
        } else {
            showMessage('Product added successfully!');
            document.getElementById('add-product-form').reset();
            loadProducts();
        }
    }

    function showMessage(text, isError = false) {
        const msgBox = document.getElementById('msg-container');
        if (!msgBox) return;
        msgBox.innerText = text;
        msgBox.className = 'msg-box' + (isError ? ' error' : '');
        msgBox.style.display = 'block';
        setTimeout(() => { msgBox.style.display = 'none'; }, 4000);
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Admin Dashboard</title>

    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #f4f6f8; padding: 20px; padding-bottom: 80px; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.85rem; color: #555; margin-bottom: 4px; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
        button { background: #007bff; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #aaa; cursor: not-allowed; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #ddd; font-size: 0.9rem; }
        .msg-box { background: #e6ffe6; color: #1e7e34; padding: 10px; border-radius: 6px; margin-bottom: 15px; display: none; }
        .msg-box.error { background: #ffe6e6; color: #d93025; }
        
        /* Bottom Fixed Navigation Bar */
        .footer-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; border-top: 1px solid #ddd; display: flex; justify-content: space-around; padding: 15px 0; z-index: 1000; }
        .footer-nav a { text-decoration: none; color: #666; font-size: 0.85rem; display: flex; flex-direction: column; align-items: center; gap: 3px; font-weight: 500; }
        .footer-nav a.active { color: #007bff; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>Admin Control Panel</h2>
            <div>
                <a href="chat.html" style="margin-right: 15px; color: #007bff; text-decoration: none; font-weight: bold;">
                    <i class="fa-solid fa-message"></i> Open Chats
                </a>
                <a href="#" id="logout-btn" style="color: #d93025; text-decoration: none; font-weight: bold;">Logout</a>
            </div>
        </div>

        <div id="msg-container" class="msg-box"></div>

        <!-- Add Product Card -->
        <div class="card">
            <h3>Add New Product</h3>
            <form id="add-product-form">
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" id="p-name" required>
                </div>
                <div class="form-group">
                    <label for="product-category">Category:</label>
                    <select id="product-category" required>
                        <option value="cakes">Cake</option>
                        <option value="pastries">Pastry</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Price (₦)</label>
                    <input type="number" step="0.01" id="p-price" required>
                </div>
                <div class="form-group">
                    <label>Search Tags (Comma Separated)</label>
                    <input type="text" id="p-tags" placeholder="e.g. phone, electronics, apple" required>
                </div>
                <div class="form-group">
                    <label>Product Image File</label>
                    <input type="file" id="p-image" accept="image/*">
                </div>
                <button type="submit" id="save-btn">Save Product</button>
            </form>
        </div>

        <!-- Manage Inventory -->
        <div class="card">
            <h3>Product Inventory</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Price</th>
                        <th>Tags</th>
                    </tr>
                </thead>
                <tbody id="products-table">
                    <tr><td colspan="4">Loading products...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav class="footer-nav">
        <a href="admin.html" class="active"><i class="fa-solid fa-gauge"></i>Dashboard</a>
        <a href="chat.html"><i class="fa-solid fa-message"></i>Chats</a>
    </nav>
    

    <script>
    // Session Guard for Admin
    const userId = localStorage.getItem('user_id');
    const role = localStorage.getItem('role');
    const adminSession = localStorage.getItem('admin_session');

    // Allow entry if role is admin OR admin_session key exists
    if (!userId || (role !== 'admin' && adminSession !== 'authenticated_admin_access')) {
        alert('Access Denied. Please log in as admin.');
        window.location.href = 'login.html';
    }

    // Initialize Supabase Client
    const SUPABASE_URL = 'https://umkhoitnouazrfdpftld.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_EzmGw6JDJyehqfK1VNhZQg_21JYto78';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.addEventListener('DOMContentLoaded', () => {
        loadProducts();
        
        document.getElementById('add-product-form').addEventListener('submit', handleAddProduct);
        document.getElementById('logout-btn').addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.clear();
            window.location.href = 'login.html';
        });
    });

    // Load Inventory
    async function loadProducts() {
        const tableBody = document.getElementById('products-table');

        const { data: products, error } = await _supabase
            .from('products')
            .select('*')
            .order('id', { ascending: false });

        if (error) {
            tableBody.innerHTML = '<tr><td colspan="5" style="color:red;">Error loading products.</td></tr>';
            return;
        }

        if (!products || products.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="5">No products found.</td></tr>';
            return;
        }

        tableBody.innerHTML = '';
        products.forEach(p => {
            const formattedPrice = parseFloat(p.price || 0).toLocaleString('en-US', { minimumFractionDigits: 2 });
            const row = `
                <tr>
                    <td>#${p.id}</td>
                    <td>${escapeHtml(p.name)}</td>
                    <td>${escapeHtml(p.category || 'N/A')}</td>
                    <td>₦${formattedPrice}</td>
                    <td>${escapeHtml(p.tags || '')}</td>
                </tr>
            `;
            tableBody.innerHTML += row;
        });
    }

    // Add Product + Handle File Upload
    async function handleAddProduct(e) {
        e.preventDefault();
        const saveBtn = document.getElementById('save-btn');
        saveBtn.disabled = true;
        saveBtn.innerText = 'Saving...';

        const name = document.getElementById('p-name').value.trim();
        const price = parseFloat(document.getElementById('p-price').value);
        const category = document.getElementById('product-category').value; // Grab selected category
        const tags = document.getElementById('p-tags').value.trim().toLowerCase();
        const fileInput = document.getElementById('p-image');
        
        let imageUrl = 'https://via.placeholder.com/150';

        // 1. Upload image to Supabase Storage if file is selected
        if (fileInput.files.length > 0) {
            const file = fileInput.files[0];
            const fileExt = file.name.split('.').pop();
            const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;
            const filePath = `products/${fileName}`;

            const { data: uploadData, error: uploadError } = await _supabase.storage
                .from('product-images')
                .upload(filePath, file);

            if (!uploadError && uploadData) {
                const { data: publicUrlData } = _supabase.storage
                    .from('product-images')
                    .getPublicUrl(filePath);
                
                imageUrl = publicUrlData.publicUrl;
            } else {
                console.warn('Image upload failed or bucket not set up. Using fallback image URL.');
            }
        }

        // 2. Insert Product into Database Table (including category)
        const { error: insertError } = await _supabase
            .from('products')
            .insert([{ 
                name: name, 
                price: price, 
                category: category, // Saves 'cakes' or 'pastries'
                tags: tags, 
                image_url: imageUrl 
            }]);

        saveBtn.disabled = false;
        saveBtn.innerText = 'Save Product';

        if (insertError) {
            showMessage('Error adding product: ' + insertError.message, true);
        } else {
            showMessage('Product added successfully!');
            document.getElementById('add-product-form').reset();
            loadProducts();
        }
    }

    function showMessage(text, isError = false) {
        const msgBox = document.getElementById('msg-container');
        if (!msgBox) return;
        msgBox.innerText = text;
        msgBox.className = 'msg-box' + (isError ? ' error' : '');
        msgBox.style.display = 'block';
        setTimeout(() => { msgBox.style.display = 'none'; }, 4000);
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
    }
</script>
</body>
</html>

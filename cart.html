<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>My Cart & Orders</title>

    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
}

body {
    background: #f1f5f9;
    padding-bottom: 85px;
}

.container {
    max-width: 650px;
    margin: 25px auto;
    padding: 0 16px;
}

h2 {
    margin-bottom: 20px;
    color: #0f172a;
    font-weight: 700;
    font-size: 1.5rem;
}

.order-card {
    background: #ffffff;
    border-radius: 14px;
    border: 1px solid #e2e8f0;
    padding: 16px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.order-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
}

.order-card img {
    width: 68px;
    height: 68px;
    object-fit: cover;
    border-radius: 10px;
    border: 1px solid #cbd5e1;
}

.order-details {
    flex: 1;
}

.order-title {
    font-weight: 600;
    color: #0f172a;
    font-size: 1rem;
    margin-bottom: 4px;
}

.order-meta {
    font-size: 0.85rem;
    color: #64748b;
}

.order-meta strong {
    color: #2563eb;
}

.btn-chat {
    text-decoration: none;
    background: #eff6ff;
    color: #2563eb;
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    border: 1px solid #bfdbfe;
    transition: all 0.2s ease;
}

.btn-chat:hover {
    background: #2563eb;
    color: #ffffff;
}

.footer-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #0f172a;
    border-top: 1px solid #1e293b;
    display: flex;
    justify-content: space-around;
    padding: 12px 0;
    z-index: 1000;
    box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.15);
}

.footer-nav a {
    text-decoration: none;
    color: #94a3b8;
    font-size: 0.82rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-weight: 600;
}

.footer-nav a i {
    font-size: 1.2rem;
}

.footer-nav a.active {
    color: #38bdf8;
}
    </style>
</head>
<body>

    <div class="container">
        <h2>My Purchases & Cart</h2>
        <div id="orders-container">
            <p style="color: #666;">Loading your purchases...</p>
        </div>
    </div>

    <!-- Fixed Footer Navigation -->
    <nav class="footer-nav">
        <a href="index.html"><i class="fa-solid fa-house"></i>Home</a>
        <a href="cart.html" class="active"><i class="fa-solid fa-cart-shopping"></i>Cart</a>
        <a href="chat.html"><i class="fa-solid fa-message"></i>Chat</a>
    </nav>

    <script>
        // Check Customer Session Guard
        const customerId = localStorage.getItem('user_id');
        if (!customerId) {
            window.location.href = 'login.html';
        }

        // Initialize Supabase
        const SUPABASE_URL = 'https://umkhoitnouazrfdpftld.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_EzmGw6JDJyehqfK1VNhZQg_21JYto78';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.addEventListener('DOMContentLoaded', loadCustomerOrders);

        async function loadCustomerOrders() {
            const container = document.getElementById('orders-container');

            // Fetch orders for this customer along with product details
            const { data: orders, error } = await _supabase
                .from('orders')
                .select(`
                    id,
                    status,
                    created_at,
                    products (
                        name,
                        price,
                        image_url
                    )
                `)
                .eq('customer_id', customerId)
                .order('id', { ascending: false });

            if (error) {
                console.error("Error loading orders:", error);
                container.innerHTML = '<p style="color: red;">Failed to load your orders. Please try again.</p>';
                return;
            }

            if (!orders || orders.length === 0) {
                container.innerHTML = '<p style="color: #666;">You haven\'t placed any orders yet.</p>';
                return;
            }

            container.innerHTML = ''; // Clear loading text

            orders.forEach(order => {
                const product = order.products || {};
                const name = product.name || 'Unknown Product';
                const price = parseFloat(product.price || 0).toLocaleString('en-US', { minimumFractionDigits: 2 });
                const imageUrl = product.image_url || 'https://via.placeholder.com/150';

                const cardHtml = `
                    <div class="order-card">
                        <img src="${escapeHtml(imageUrl)}" alt="Product">
                        <div class="order-details">
                            <div class="order-title">${escapeHtml(name)}</div>
                            <div class="order-meta">₦${price} | Status: <strong>${escapeHtml(order.status || 'Pending')}</strong></div>
                        </div>
                        <a href="chat.html?order_id=${order.id}" class="btn-chat">Open Chat</a>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
        }
    </script>
</body>
</html>

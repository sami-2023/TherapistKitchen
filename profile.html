<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>My Profile</title>
    
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #f8f9fa; padding-bottom: 80px; }
        .container { max-width: 500px; margin: 30px auto; padding: 0 15px; }
        .card { background: #fff; padding: 25px; border-radius: 12px; border: 1px solid #eee; box-shadow: 0 2px 8px rgba(0,0,0,0.05); text-align: center; }
        .profile-img-preview { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; margin-bottom: 15px; border: 3px solid #007bff; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-size: 0.85rem; color: #555; font-weight: bold; }
        input[type="text"], input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:disabled { background: #80bdff; cursor: not-allowed; }
        .btn-logout { display: block; margin-top: 15px; background: #dc3545; text-decoration: none; text-align: center; color: white; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; border: none; width: 100%; }
        .msg-success { background: #e6ffe6; color: #1e7e34; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 0.9rem; display: none; }
        .msg-error { background: #ffe6e6; color: #d93025; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 0.9rem; display: none; }

        .footer-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; border-top: 1px solid #ddd; display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000; }
        .footer-nav a { text-decoration: none; color: #666; font-size: 0.85rem; display: flex; flex-direction: column; align-items: center; gap: 3px; font-weight: 500; }
        .footer-nav a.active { color: #007bff; }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h2>Account Profile</h2><br>

            <div id="msg-success" class="msg-success"></div>
            <div id="msg-error" class="msg-error"></div>

            <img id="profile-preview" src="https://via.placeholder.com/150" class="profile-img-preview" alt="Profile Picture">

            <form id="profile-form">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label>Change Profile Picture</label>
                    <input type="file" id="profile_pic" name="profile_pic" accept="image/*">
                </div>
                <button type="submit" id="save-btn">Save Changes</button>
            </form>

            <button type="button" class="btn-logout" onclick="logout()">Logout</button>
        </div>
    </div>

    <!-- Fixed Footer Navigation -->
    <nav class="footer-nav">
        <a href="index.html"><i class="fa-solid fa-house"></i>Home</a>
        <a href="cart.html"><i class="fa-solid fa-cart-shopping"></i>Orders/Cart</a>
        <a href="chat.html"><i class="fa-solid fa-message"></i>Chat</a>
    </nav>

    <script>
        // Check Authentication
        const customerId = localStorage.getItem('user_id');
        const role = localStorage.getItem('role');

        if (!customerId || role !== 'customer') {
            window.location.href = 'login.html';
        }

        // Initialize Supabase Client
        const SUPABASE_URL = 'https://umkhoitnouazrfdpftld.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_EzmGw6JDJyehqfK1VNhZQg_21JYto78';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Load profile data on load
        document.addEventListener('DOMContentLoaded', loadProfile);

        // 1. Fetch current profile details
        async function loadProfile() {
            const { data: user, error } = await _supabase
                .from('users')
                .select('username, profile_pic')
                .eq('id', customerId)
                .single();

            if (error) {
                showError('Error loading profile information.');
                return;
            }

            if (user) {
                document.getElementById('username').value = user.username || '';
                if (user.profile_pic) {
                    let cleanPic = user.profile_pic.replace('./', '');
                    document.getElementById('profile-preview').src = cleanPic + '?v=' + new Date().getTime();
                }
            }
        }

        // 2. Handle Profile Update
        document.getElementById('profile-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlerts();

            const saveBtn = document.getElementById('save-btn');
            saveBtn.disabled = true;
            saveBtn.innerText = 'Saving...';

            const newUsername = document.getElementById('username').value.trim();
            const fileInput = document.getElementById('profile_pic');
            const file = fileInput.files[0];

            let profilePicUrl = null;

            // Optional Image Upload via Supabase Storage
            if (file) {
                const allowedTypes = ['image/jpeg', 'image/png', 'image/webp', 'image/gif'];
                if (!allowedTypes.includes(file.type)) {
                    showError('Invalid file type. Only JPG, PNG, WEBP, and GIF allowed.');
                    saveBtn.disabled = false;
                    saveBtn.innerText = 'Save Changes';
                    return;
                }

                const fileExt = file.name.split('.').pop();
                const filePath = `user_${customerId}_${Date.now()}.${fileExt}`;

                // Upload file to Supabase Storage Bucket ('profile_pics')
                const { data: uploadData, error: uploadError } = await _supabase
                    .storage
                    .from('profile_pics')
                    .upload(filePath, file);

                if (uploadError) {
                    showError('Error uploading image: ' + uploadError.message);
                    saveBtn.disabled = false;
                    saveBtn.innerText = 'Save Changes';
                    return;
                }

                // Get Public URL for the uploaded file
                const { data: publicUrlData } = _supabase
                    .storage
                    .from('profile_pics')
                    .getPublicUrl(filePath);

                profilePicUrl = publicUrlData.publicUrl;
            }

            // Prepare update object
            const updates = { username: newUsername };
            if (profilePicUrl) {
                updates.profile_pic = profilePicUrl;
            }

            // Update user record in Database
            const { error: updateError } = await _supabase
                .from('users')
                .update(updates)
                .eq('id', customerId);

            if (updateError) {
                showError('Failed to update profile: ' + updateError.message);
            } else {
                localStorage.setItem('username', newUsername);
                showSuccess(profilePicUrl ? 'Profile updated successfully!' : 'Username updated successfully!');
                
                // Update preview image immediately
                if (profilePicUrl) {
                    document.getElementById('profile-preview').src = profilePicUrl;
                }
            }

            saveBtn.disabled = false;
            saveBtn.innerText = 'Save Changes';
        });

        // 3. Logout Helper
        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }

        // UI Alert Helpers
        function showSuccess(msg) {
            const el = document.getElementById('msg-success');
            el.innerText = msg;
            el.style.display = 'block';
        }

        function showError(msg) {
            const el = document.getElementById('msg-error');
            el.innerText = msg;
            el.style.display = 'block';
        }

        function hideAlerts() {
            document.getElementById('msg-success').style.display = 'none';
            document.getElementById('msg-error').style.display = 'none';
        }
    </script>
</body>
</html>

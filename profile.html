<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>My Profile</title>
    
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
}

body {
    background: #f1f5f9;
    padding-bottom: 90px;
}

.container {
    max-width: 480px;
    margin: 40px auto;
    padding: 0 16px;
}

.card {
    background: #ffffff;
    padding: 32px 24px;
    border-radius: 20px;
    border: 1px solid #e2e8f0;
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05);
    text-align: center;
}

.card h2 {
    font-size: 1.5rem;
    color: #0f172a;
    font-weight: 700;
}

.profile-img-preview {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    object-fit: cover;
    margin: 15px auto 20px auto;
    border: 3.5px solid #2563eb;
    box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
}

.form-group {
    margin-bottom: 18px;
    text-align: left;
}

label {
    display: block;
    margin-bottom: 6px;
    font-size: 0.82rem;
    color: #475569;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

input[type="text"], input[type="file"] {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid #cbd5e1;
    border-radius: 10px;
    font-size: 0.92rem;
    background: #f8fafc;
}

input[type="text"]:focus {
    outline: none;
    border-color: #2563eb;
}

button[type="submit"] {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
    color: white;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    font-size: 0.98rem;
    cursor: pointer;
    margin-top: 10px;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    transition: all 0.2s ease;
}

button[type="submit"]:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
}

button:disabled {
    background: #94a3b8;
    cursor: not-allowed;
    box-shadow: none;
}

.btn-logout {
    display: block;
    margin-top: 14px;
    background: #fef2f2;
    color: #dc2626;
    border: 1px solid #fecaca;
    padding: 12px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    width: 100%;
    transition: all 0.2s ease;
}

.btn-logout:hover {
    background: #dc2626;
    color: #ffffff;
}

.msg-success {
    background: #f0fdf4;
    color: #16a34a;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 18px;
    font-size: 0.88rem;
    display: none;
    border: 1px solid #bbf7d0;
}

.msg-error {
    background: #fef2f2;
    color: #dc2626;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 18px;
    font-size: 0.88rem;
    display: none;
    border: 1px solid #fecaca;
}

.footer-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #0f172a;
    border-top: 1px solid #1e293b;
    display: flex;
    justify-content: space-around;
    padding: 12px 0;
    z-index: 1000;
}

.footer-nav a {
    text-decoration: none;
    color: #94a3b8;
    font-size: 0.82rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-weight: 600;
}

.footer-nav a i {
    font-size: 1.2rem;
}

.footer-nav a.active {
    color: #38bdf8;
}
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h2>Account Profile</h2><br>

            <div id="msg-success" class="msg-success"></div>
            <div id="msg-error" class="msg-error"></div>

            <img id="profile-preview" src="https://via.placeholder.com/150" class="profile-img-preview" alt="Profile Picture">

            <form id="profile-form">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label>Change Profile Picture</label>
                    <input type="file" id="profile_pic" name="profile_pic" accept="image/*">
                </div>
                <button type="submit" id="save-btn">Save Changes</button>
            </form>

            <button type="button" class="btn-logout" onclick="logout()">Logout</button>
        </div>
    </div>

    <!-- Fixed Footer Navigation -->
    <nav class="footer-nav">
        <a href="index.html"><i class="fa-solid fa-house"></i>Home</a>
        <a href="cart.html"><i class="fa-solid fa-cart-shopping"></i>Orders/Cart</a>
        <a href="chat.html"><i class="fa-solid fa-message"></i>Chat</a>
    </nav>

    <script>
        // Check Authentication
        const customerId = localStorage.getItem('user_id');
        const role = localStorage.getItem('role');

        if (!customerId || role !== 'customer') {
            window.location.href = 'login.html';
        }

        // Initialize Supabase Client
        const SUPABASE_URL = 'https://umkhoitnouazrfdpftld.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_EzmGw6JDJyehqfK1VNhZQg_21JYto78';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Load profile data on load
        document.addEventListener('DOMContentLoaded', loadProfile);

        // 1. Fetch current profile details
        async function loadProfile() {
            const { data: user, error } = await _supabase
                .from('users')
                .select('username, profile_pic')
                .eq('id', customerId)
                .single();

            if (error) {
                showError('Error loading profile information.');
                return;
            }

            if (user) {
                document.getElementById('username').value = user.username || '';
                if (user.profile_pic) {
                    let cleanPic = user.profile_pic.replace('./', '');
                    document.getElementById('profile-preview').src = cleanPic + '?v=' + new Date().getTime();
                }
            }
        }

        // 2. Handle Profile Update
        document.getElementById('profile-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlerts();

            const saveBtn = document.getElementById('save-btn');
            saveBtn.disabled = true;
            saveBtn.innerText = 'Saving...';

            const newUsername = document.getElementById('username').value.trim();
            const fileInput = document.getElementById('profile_pic');
            const file = fileInput.files[0];

            let profilePicUrl = null;

            // Optional Image Upload via Supabase Storage
            if (file) {
                const allowedTypes = ['image/jpeg', 'image/png', 'image/webp', 'image/gif'];
                if (!allowedTypes.includes(file.type)) {
                    showError('Invalid file type. Only JPG, PNG, WEBP, and GIF allowed.');
                    saveBtn.disabled = false;
                    saveBtn.innerText = 'Save Changes';
                    return;
                }

                const fileExt = file.name.split('.').pop();
                const filePath = `user_${customerId}_${Date.now()}.${fileExt}`;

                // Upload file to Supabase Storage Bucket ('profile_pics')
                const { data: uploadData, error: uploadError } = await _supabase
                    .storage
                    .from('profile_pics')
                    .upload(filePath, file);

                if (uploadError) {
                    showError('Error uploading image: ' + uploadError.message);
                    saveBtn.disabled = false;
                    saveBtn.innerText = 'Save Changes';
                    return;
                }

                // Get Public URL for the uploaded file
                const { data: publicUrlData } = _supabase
                    .storage
                    .from('profile_pics')
                    .getPublicUrl(filePath);

                profilePicUrl = publicUrlData.publicUrl;
            }

            // Prepare update object
            const updates = { username: newUsername };
            if (profilePicUrl) {
                updates.profile_pic = profilePicUrl;
            }

            // Update user record in Database
            const { error: updateError } = await _supabase
                .from('users')
                .update(updates)
                .eq('id', customerId);

            if (updateError) {
                showError('Failed to update profile: ' + updateError.message);
            } else {
                localStorage.setItem('username', newUsername);
                showSuccess(profilePicUrl ? 'Profile updated successfully!' : 'Username updated successfully!');
                
                // Update preview image immediately
                if (profilePicUrl) {
                    document.getElementById('profile-preview').src = profilePicUrl;
                }
            }

            saveBtn.disabled = false;
            saveBtn.innerText = 'Save Changes';
        });

        // 3. Logout Helper
        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }

        // UI Alert Helpers
        function showSuccess(msg) {
            const el = document.getElementById('msg-success');
            el.innerText = msg;
            el.style.display = 'block';
        }

        function showError(msg) {
            const el = document.getElementById('msg-error');
            el.innerText = msg;
            el.style.display = 'block';
        }

        function hideAlerts() {
            document.getElementById('msg-success').style.display = 'none';
            document.getElementById('msg-error').style.display = 'none';
        }
    </script>
</body>
</html>
